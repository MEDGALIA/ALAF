name: Mirror JSON to xlsx

# Mirror of xlsx-to-json.yml. On a PR touching data/json/**, regenerates the
# xlsx so UI-originated, JSON-only edits don't leave the workbook (and the
# Drive mirror) stale. (#36)

on:
  pull_request:
    paths:
      - "data/json/**"

permissions:
  contents: write

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Skip if the xlsx also changed in this PR (xlsx-to-json.yml owns that case)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          FILES=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files --jq '.files[].path')
          if grep -q 'VANTAGE-Technology-Radar.xlsx' <<< "$FILES"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - run: pip install -r src/scripts/requirements.txt
        if: steps.check.outputs.skip != 'true'

      - name: Regenerate xlsx from JSON
        if: steps.check.outputs.skip != 'true'
        run: python src/scripts/json_to_xlsx.py

      - name: Commit and push the regenerated xlsx if it changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/VANTAGE-Technology-Radar.xlsx
          if git diff --cached --quiet; then
            echo "No changes to mirror"
          else
            git commit -m "Mirror data/json/ changes into the workbook"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
