name: Data review

# Required status check. A PR that changes nothing under data/ passes at once,
# so a guide or code fix needs no second person. A PR that changes anything
# under data/ passes only once a CODEOWNERS curator has approved it. (#45)
#
# No `paths:` filter: a required check that is skipped never reports, which
# would leave every other PR blocked forever.
#
# pull_request_review re-runs it against the same head commit, so submitting an
# approval turns the check green without a new push.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  data-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CODEOWNERS is read from the base branch, so a PR cannot widen its
          # own approver list by editing CODEOWNERS in the same PR.
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for a curator approval on data/ changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python src/scripts/check_data_review.py \
            --repo "${REPO}" \
            --pr-number "${PR_NUMBER}"
