name: Deletion authorization

# Required status check: blocks merging a PR that deletes a VT Radar row
# (an ID missing from every data sheet in data/json/, not moved to
# Deprecated) unless an admin (.github/RADAR-ADMINS) has approved the PR.
#
# Runs on both PR content changes and new reviews, so a review submitted
# after a failing check re-runs it against the same commit.
#
# Checks approval, not merge: a repo admin can still merge past a failing
# check via branch protection's admin-bypass setting.

# No `paths:` filter: a required check that's skipped never reports,
# leaving the PR blocked. Exits immediately when no row was deleted.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Both refs are named explicitly: on pull_request_review the default
      # checkout ref is the base branch, not the PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for unauthorized deletions
        working-directory: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/scripts/check_deletion_authorization.py \
            --base-dir ../base/data/json \
            --head-dir data/json \
            --admins-file .github/RADAR-ADMINS \
            --repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }}
